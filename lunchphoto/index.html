<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生外出午膳證自動化系統</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        /* ====== 核心 A4 排版引擎 ====== */
        :root {
            --a4-width: 210mm;
            --a4-height: 297mm;
        }

        /* 螢幕預覽模式下的背景 */
        body {
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* 虛擬 A4 紙張的設定 (一頁 4 名學生，每張卡片約 64mm 高) */
        .a4-page {
            width: var(--a4-width);
            height: var(--a4-height);
            background: white;
            margin: 20px auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: 10mm 8mm; /* 紙張四邊留白 */
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            page-break-after: always;
            break-after: page;
        }

        .a4-page:last-child {
            page-break-after: auto;
            break-after: auto;
        }

        /* 網頁頁首安全標章 */
        .bento-security-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border: 1px solid #6ee7b7;
            color: #047857;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.35;
        }

        .bento-security-badge svg {
            flex: 0 0 auto;
            width: 18px;
            height: 18px;
        }

        /* 外出午膳證外框 (單個學生區塊) */
        .pass-card {
            width: 100%;
            height: 64mm; /* 一頁4個卡片 */
            border: 1px solid #1e293b;
            box-sizing: border-box;
            display: flex;
            position: relative;
            background: #ffffff;
            margin-bottom: 2mm;
            page-break-inside: avoid;
            overflow: hidden; /* 確保直角三角形不溢出 */
        }

        /* 緊貼左上角的直角三角形 (按級別分色) */
        .grade-corner-triangle {
            position: absolute;
            top: 0;
            left: 0;
            width: 14mm;
            height: 14mm;
            clip-path: polygon(0 0, 100% 0, 0 100%);
            z-index: 10;
        }

        /* 正面 (左邊) 與 背面 (右邊) 對折分欄 */
        .pass-side {
            width: 50%;
            height: 100%;
            padding: 2.5mm 3mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* 正面 (左邊) */
        .pass-front {
            border-right: 1px dashed #94a3b8; /* 對折虛線 */
        }

        /* 正面頁首 */
        .front-header {
            display: flex;
            align-items: center;
            gap: 2mm;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 1mm;
            padding-left: 11mm; /* 避開左上角級別三角形，讓校徽向右移 */
        }

        .school-logo {
            width: 13mm;
            height: 13mm;
            object-fit: contain;
            flex-shrink: 0;
        }

        .school-logo-placeholder {
            width: 13mm;
            height: 13mm;
            border: 1px dashed #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6pt;
            color: #94a3b8;
            flex-shrink: 0;
        }

        .front-title-container {
            flex: 1;
            text-align: center;
        }

        .school-title-cn {
            color: #dc2626; /* 紅色校名 */
            font-size: 10.5pt;
            font-weight: bold;
            line-height: 1.1;
        }

        .school-title-en {
            color: #dc2626;
            font-size: 6.5pt;
            font-weight: 600;
            line-height: 1.1;
            transform: scale(0.95);
        }

        .pass-title-line {
            color: #dc2626;
            font-size: 9.5pt;
            font-weight: bold;
            margin-top: 0.5mm;
            display: flex;
            justify-content: center;
            gap: 3mm;
        }

        .school-year-text {
            color: #ea580c; /* 橙色學年 */
            font-size: 10pt;
            font-weight: bold;
            text-align: center;
            margin-top: 0.5mm;
        }

        /* 正面主體：相片 + 學生資料 */
        .front-body {
            display: flex;
            align-items: center;
            gap: 3mm;
            margin-top: 1.5mm;
            flex: 1;
        }

        .photo-box {
            width: 22mm;
            height: 28mm;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            background: #f8fafc;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .student-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 100%;
            min-width: 0;
        }

        .class-badge {
            color: #059669; /* 綠色大字級別 S1-S6 */
            font-size: 28pt;
            font-weight: 900;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
        }

        .info-row {
            font-size: 8.5pt;
            line-height: 1.35;
            color: #0f172a;
            display: flex;
            align-items: flex-start;
        }

        .info-label {
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .info-value {
            font-weight: bold;
            font-size: 9.5pt;
            word-break: break-word;
            overflow-wrap: anywhere;
            padding-left: 2px;
        }

        /* 背面 (右邊) */
        .pass-back {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .back-header {
            color: #1d4ed8; /* 藍色地址與電話 */
            font-size: 7pt;
            line-height: 1.3;
            border-bottom: 1px solid #1d4ed8;
            padding-bottom: 1.5mm;
        }

        .disclaimer-box {
            background-color: #f8fafc;
            border: 1px solid #64748b;
            padding: 2.5mm 3mm;
            font-size: 7.5pt;
            line-height: 1.35;
            color: #0f172a;
            border-radius: 4px;
            margin-top: auto;
            margin-bottom: auto;
        }

        /* ====== 列印專用設定 ====== */
        @media print {
            .no-print { display: none !important; }
            
            @page {
                size: A4 portrait;
                margin: 0;
            }

            html, body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            #preview-wrap {
                margin: 0 !important;
                padding: 0 !important;
                max-width: none !important;
                width: auto !important;
            }

            #print-container {
                margin: 0 !important;
                padding: 0 !important;
            }

            .a4-page {
                margin: 0 !important;
                box-shadow: none !important;
                border: none !important;
                width: 210mm !important;
                height: 297mm !important;
            }
        }
    </style>
</head>
<body>

    <!-- 控制面板 (列印時隱藏) -->
    <div class="no-print bg-white shadow-md p-6 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-800 mb-4 flex items-center justify-between gap-4 flex-wrap">
                <span class="flex items-center">
                    <svg class="w-6 h-6 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2H5zM5 14a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 00-2-2H5z"></path></svg>
                    學生外出午膳證自動化系統
                </span>

                <div class="bento-security-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                    <span>符合資訊素養及網絡安全規範，處理過程純本地進行。</span>
                </div>
            </h1>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 步驟 1: 上傳 Excel -->
                <div class="border rounded-lg p-4 bg-blue-50">
                    <h3 class="font-bold text-blue-800 mb-2">1. 載入全校學生名單 (Excel)</h3>
                    <input type="file" id="excelInput" accept=".xlsx, .xls" class="block w-full text-sm text-slate-500
                        file:mr-4 file:py-2 file:px-4 file:rounded-md
                        file:border-0 file:text-sm file:font-semibold
                        file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer
                    "/>
                    <p class="text-xs text-blue-600 mt-2" id="excelStatus">請確保檔案包含 S1-S6 分頁，資料位於 D-G 欄。</p>
                </div>

                <!-- 步驟 2: 選擇相片資料夾 -->
                <div class="border rounded-lg p-4 bg-green-50">
                    <h3 class="font-bold text-green-800 mb-2">2. 載入相片主資料夾</h3>
                    <input type="file" id="photoInput" webkitdirectory directory multiple class="block w-full text-sm text-slate-500
                        file:mr-4 file:py-2 file:px-4 file:rounded-md
                        file:border-0 file:text-sm file:font-semibold
                        file:bg-green-600 file:text-white hover:file:bg-green-700 cursor-pointer
                    "/>
                    <div class="flex items-center gap-2 mt-2">
                        <label for="photoQuality" class="text-xs font-semibold text-green-800 whitespace-nowrap">相片解析度</label>
                        <select id="photoQuality" class="flex-1 text-xs p-1 border border-green-300 rounded bg-white">
                            <option value="280">細 — 檔案最細 (280px)</option>
                            <option value="400" selected>標準 — 300dpi 列印 (400px)</option>
                            <option value="600">高 — 較清晰 (600px)</option>
                            <option value="0">原圖 — 不壓縮 (檔案極大)</option>
                        </select>
                    </div>
                    <p class="text-xs text-green-600 mt-2" id="photoStatus">檔名格式為「班別班號.jpg」(如 1A01.jpg)。</p>
                </div>

                <!-- 步驟 3: 選擇模式與列印 -->
                <div class="border rounded-lg p-4 bg-purple-50 flex flex-col justify-between">
                    <div>
                        <h3 class="font-bold text-purple-800 mb-2">3. 預覽與列印</h3>
                        
                        <div class="flex items-center gap-2 mb-2">
                            <label for="schoolYear" class="text-xs font-semibold text-purple-800 whitespace-nowrap">學年</label>
                            <input type="text" id="schoolYear" value="2024 - 2025" placeholder="2024 - 2025" maxlength="11"
                                class="flex-1 p-1 text-sm text-center border border-gray-300 rounded-md bg-white font-semibold text-amber-700" />
                        </div>

                        <!-- 模式選擇 (全班/全校 vs 自選學生) -->
                        <div class="flex gap-2 mb-2">
                            <label class="flex-1 text-xs text-center py-1 px-2 rounded cursor-pointer border bg-purple-600 text-white font-medium" id="modeBatchBtn">
                                <input type="radio" name="printMode" value="batch" checked class="hidden" onchange="togglePrintMode('batch')">
                                按班別 / 全校
                            </label>
                            <label class="flex-1 text-xs text-center py-1 px-2 rounded cursor-pointer border bg-white text-purple-800 font-medium" id="modeCustomBtn">
                                <input type="radio" name="printMode" value="custom" class="hidden" onchange="togglePrintMode('custom')">
                                自選學生 (補發/插班)
                            </label>
                        </div>

                        <!-- 模式 A：下拉多選 -->
                        <div id="batchSelectContainer" class="relative">
                            <button id="classSelectBtn" type="button" disabled
                                class="w-full flex items-center justify-between p-2 mb-2 border border-gray-300 rounded-md bg-white text-sm text-gray-700 disabled:bg-gray-100 disabled:text-gray-400 cursor-pointer shadow-sm hover:border-purple-400 transition"
                                onclick="toggleClassDropdown()">
                                <span id="classSelectBtnText" class="truncate font-medium">請先載入 Excel 名單</span>
                                <svg class="w-4 h-4 ml-1 text-gray-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>

                            <!-- 下拉多選浮層 -->
                            <div id="classDropdownMenu" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-purple-200 rounded-lg shadow-2xl z-50 p-3 max-h-80 overflow-y-auto">
                                <div class="flex items-center justify-between gap-1 pb-2 border-b border-gray-200 mb-2">
                                    <button type="button" onclick="selectAllClasses(true)" class="px-2 py-1 bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold rounded shadow-sm">全選 (全校)</button>
                                    <button type="button" onclick="selectAllClasses(false)" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-semibold rounded">清空</button>
                                </div>
                                <div id="gradeQuickButtons" class="flex flex-wrap gap-1 pb-2 border-b border-gray-100 mb-2">
                                    <!-- 動態生成級別按鈕 S1-S6 -->
                                </div>
                                <div id="classListOptions" class="grid grid-cols-2 gap-1.5 text-xs text-gray-700">
                                    <!-- 動態填入班別 -->
                                </div>
                            </div>
                        </div>

                        <!-- 模式 B：自選學生按鈕 -->
                        <div id="customSelectContainer" class="hidden">
                            <button id="openPickerBtn" disabled onclick="openStudentPickerModal()" class="w-full py-2 px-3 bg-white border border-purple-400 text-purple-700 font-semibold rounded text-sm hover:bg-purple-100 flex items-center justify-between">
                                <span>選擇特定學生...</span>
                                <span id="selectedCountBadge" class="bg-purple-600 text-white text-xs px-2 py-0.5 rounded-full">0 人</span>
                            </button>
                        </div>
                    </div>

                    <button id="printBtn" disabled onclick="window.print()" class="w-full mt-2 bg-purple-600 text-white font-bold py-2 px-4 rounded disabled:bg-gray-400 disabled:cursor-not-allowed hover:bg-purple-700 transition">
                        列印 / 匯出 PDF
                    </button>
                </div>
            </div>

            <!-- 級別顏色對照圖例 -->
            <div class="mt-4 pt-3 border-t border-gray-200 flex items-center gap-4 text-xs text-gray-600 flex-wrap">
                <span class="font-bold text-gray-700">級別角標顏色對照：</span>
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-red-500 inline-block"></span> S1 (紅)</span>
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-orange-500 inline-block"></span> S2 (橙)</span>
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-amber-400 inline-block"></span> S3 (黃)</span>
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-emerald-500 inline-block"></span> S4 (綠)</span>
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-blue-500 inline-block"></span> S5 (藍)</span>
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-purple-500 inline-block"></span> S6 (紫)</span>
            </div>
        </div>
    </div>

    <!-- 自選學生對話框 (Modal) -->
    <div id="studentPickerModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden">
            <!-- Modal Header -->
            <div class="p-4 bg-purple-700 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg">自選特定學生 (跨班別 / 補發 / 插班)</h3>
                <button onclick="closeStudentPickerModal()" class="text-white/80 hover:text-white text-xl font-bold px-2">&times;</button>
            </div>

            <!-- Search & Filter Bar -->
            <div class="p-4 bg-gray-50 border-b flex gap-3 flex-wrap items-center">
                <div class="flex-1 min-w-[200px]">
                    <input type="text" id="modalSearchInput" oninput="filterModalStudentList()" placeholder="搜尋姓名、學號、班別 (如 1A 或 陳大文)..." 
                           class="w-full p-2 border rounded-lg text-sm">
                </div>
                <select id="modalClassFilter" onchange="filterModalStudentList()" class="p-2 border rounded-lg text-sm bg-white">
                    <option value="">所有班別</option>
                </select>
                <div class="flex gap-2">
                    <button onclick="selectAllFilteredStudents(true)" class="px-3 py-1.5 bg-purple-100 text-purple-700 text-xs font-semibold rounded hover:bg-purple-200">全選目前篩選</button>
                    <button onclick="selectAllFilteredStudents(false)" class="px-3 py-1.5 bg-gray-200 text-gray-700 text-xs font-semibold rounded hover:bg-gray-300">清空選擇</button>
                </div>
            </div>

            <!-- Student List Table -->
            <div class="flex-1 overflow-y-auto p-4">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-100 text-gray-600 sticky top-0">
                        <tr>
                            <th class="p-2 w-10 text-center"><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAllModal(this.checked)"></th>
                            <th class="p-2">學號</th>
                            <th class="p-2">中文姓名</th>
                            <th class="p-2">English Name</th>
                            <th class="p-2 text-center">相片狀態</th>
                        </tr>
                    </thead>
                    <tbody id="modalStudentTableBody" class="divide-y">
                        <!-- 動態渲染學生列表 -->
                    </tbody>
                </table>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t bg-gray-50 flex justify-between items-center">
                <span class="text-sm font-medium text-gray-700">已選擇 <strong id="modalSelectedCount" class="text-purple-700">0</strong> 位學生</span>
                <div class="flex gap-2">
                    <button onclick="closeStudentPickerModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-semibold hover:bg-gray-300">取消</button>
                    <button onclick="applyCustomStudentSelection()" class="px-5 py-2 bg-purple-600 text-white rounded-lg text-sm font-bold hover:bg-purple-700">確認並套用預覽</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 預覽區域與報告面板 -->
    <div id="preview-wrap" class="max-w-6xl mx-auto mt-6 px-4">

        <!-- 缺失相片報告面板 (列印時隱藏) -->
        <div id="missingReportPanel" class="no-print hidden mb-6 bg-red-50 border border-red-200 rounded-lg p-4 shadow-sm">
            <h3 class="text-lg font-bold text-red-700 mb-2 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                缺失相片報告
            </h3>
            <p class="text-sm text-red-600 mb-3" id="missingReportSummary"></p>
            <div class="max-h-40 overflow-y-auto bg-white rounded border border-red-100 p-2">
                <ul id="missingReportList" class="list-disc pl-5 text-sm text-gray-700 space-y-1">
                    <!-- 缺失名單動態生成 -->
                </ul>
            </div>
        </div>

        <!-- 實體 A4 畫布區 -->
        <div id="print-container" class="pb-20">
            <div id="empty-state" class="no-print flex flex-col items-center justify-center pt-20 text-gray-400">
                <svg class="w-20 h-20 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <p class="text-lg">載入資料後，實體 A4 外出午膳證預覽將在此顯示</p>
            </div>
        </div>
    </div>

    <script>
        // 缺照片的預設佔位 SVG

        // 1. 處理 Excel 上傳
        excelInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    allStudents = [];
                    const targetSheets = ['S1', 'S2', 'S3', 'S4', 'S5', 'S6'];
                    
                    targetSheets.forEach(sheetName => {
                        if (workbook.Sheets[sheetName]) {
                            const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: "A", defval: ""});
                            
                            json.forEach((row, index) => {
                                if (index === 0 && (row['D'] === '班別' || row['D'] === 'Class')) return;

                                let cls = String(row['D']).trim();
                                let num = String(row['E']).trim();
                                let enName = String(row['F']).trim();
                                let cnName = String(row['G']).trim();

                                if (cls && num && !isNaN(parseInt(num, 10))) {
                                    let numPadded = parseInt(num, 10).toString().padStart(2, '0');
                                    // 核心更改：學號設定為 1A01 格式
                                    let studentId = `${cls.toUpperCase()}${numPadded}`;
                                    let formStr = `S${cls.charAt(0)}`;

                                    allStudents.push({
                                        class: cls.toUpperCase(),
                                        num: parseInt(num, 10),
                                        classNoFormatted: numPadded,
                                        id: studentId,
                                        en: enName,
                                        cn: cnName,
                                        formStr: formStr
                                    });
                                }
                            });
                        }
                    });

                    if (allStudents.length === 0) {
                        alert("在 S1-S6 分頁的 D-G 欄中找不到有效的學生資料！請檢查 Excel 格式。");
                        return;
                    }

                    classesList = [...new Set(allStudents.map(s => s.class))].sort();
                    
                    // 預設全選所有班別
                    selectedClasses = new Set(classesList);
                    buildMultiSelectMenu();
                    updateSelectButtonLabel();

                    classSelectBtn.disabled = false;
                    openPickerBtn.disabled = false;
                    excelStatus.innerHTML = `✅ 成功讀取 ${allStudents.length} 位學生資料。`;
                    excelStatus.className = "text-xs text-green-600 mt-2 font-bold";
                    
                    if (currentPrintMode === 'batch') {
                        renderSelectedClasses();
                    }

                } catch (error) {
                    console.error(error);
                    alert("讀取 Excel 失敗，請確保檔案格式正確。");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // 構建多選下拉面板的內容
        function buildMultiSelectMenu() {
            // 構建級別快捷鍵 (S1-S6)
            const availableGrades = [...new Set(classesList.map(c => c.charAt(0)))].sort();
            gradeQuickButtons.innerHTML = '';
            availableGrades.forEach(g => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'px-2 py-0.5 bg-slate-100 hover:bg-purple-100 text-purple-700 font-semibold rounded text-xs border border-slate-200';
                btn.innerText = `S${g} 級`;
                btn.onclick = () => toggleGradeClasses(g);
                gradeQuickButtons.appendChild(btn);
            });

            // 構建班別 Checkbox 列表
            classListOptions.innerHTML = '';
            classesList.forEach(cls => {
                const count = allStudents.filter(s => s.class === cls).length;
                const isChecked = selectedClasses.has(cls);

                const label = document.createElement('label');
                label.className = 'flex items-center gap-1.5 p-1.5 rounded hover:bg-purple-50 cursor-pointer select-none';
                label.innerHTML = `
                    <input type="checkbox" value="${cls}" ${isChecked ? 'checked' : ''} 
                           class="rounded text-purple-600 focus:ring-purple-500 class-chk"
                           onchange="onClassCheckboxChange('${cls}', this.checked)">
                    <span class="font-medium text-gray-800">${cls}</span>
                    <span class="text-gray-400 text-[10px]">(${count}人)</span>
                `;
                classListOptions.appendChild(label);
            });
            
            // 更新 Modal 中的班級篩選下拉清單
            if(modalClassFilter) {
                modalClassFilter.innerHTML = '<option value="">所有班別</option>';
                classesList.forEach(cls => {
                    let opt = document.createElement('option');
                    opt.value = cls;
                    opt.innerText = `${cls} 班`;
                    modalClassFilter.appendChild(opt);
                });
            }
        }

        function onClassCheckboxChange(cls, isChecked) {
            if (isChecked) {
                selectedClasses.add(cls);
            } else {
                selectedClasses.delete(cls);
            }
            updateSelectButtonLabel();
            if (currentPrintMode === 'batch') renderSelectedClasses();
        }

        function selectAllClasses(select) {
            if (select) {
                selectedClasses = new Set(classesList);
            } else {
                selectedClasses.clear();
            }
            document.querySelectorAll('.class-chk').forEach(chk => {
                chk.checked = select;
            });
            updateSelectButtonLabel();
            if (currentPrintMode === 'batch') renderSelectedClasses();
        }

        function toggleGradeClasses(gradeChar) {
            const gradeClasses = classesList.filter(c => c.startsWith(gradeChar));
            const allSelected = gradeClasses.every(c => selectedClasses.has(c));

            gradeClasses.forEach(c => {
                if (allSelected) {
                    selectedClasses.delete(c);
                } else {
                    selectedClasses.add(c);
                }
            });

            document.querySelectorAll('.class-chk').forEach(chk => {
                chk.checked = selectedClasses.has(chk.value);
            });

            updateSelectButtonLabel();
            if (currentPrintMode === 'batch') renderSelectedClasses();
        }

        function updateSelectButtonLabel() {
            if (selectedClasses.size === 0) {
                classSelectBtnText.innerText = '⚠️ 請勾選要列印的班別 (0 班)';
            } else if (selectedClasses.size === classesList.length) {
                classSelectBtnText.innerText = `🌟 全校 (共 ${classesList.length} 班, ${allStudents.length} 人)`;
            } else {
                const totalStudentsInSelection = allStudents.filter(s => selectedClasses.has(s.class)).length;
                const sampleClasses = Array.from(selectedClasses).slice(0, 3).join(', ');
                const extra = selectedClasses.size > 3 ? '...' : '';
                classSelectBtnText.innerText = `已選 ${selectedClasses.size} 班 (${totalStudentsInSelection}人): ${sampleClasses}${extra}`;
            }
        }

        // 2. 相片縮圖處理
        async function shrinkPhoto(file, maxPx) {
            let bmp;
            try {
                bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
            } catch (err) {
                bmp = await createImageBitmap(file);
            }
            const scale = Math.min(1, maxPx / Math.max(bmp.width, bmp.height));
            const w = Math.max(1, Math.round(bmp.width * scale));
            const h = Math.max(1, Math.round(bmp.height * scale));

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(bmp, 0, 0, w, h);
            if (bmp.close) bmp.close();

            return canvas.toDataURL('image/jpeg', JPEG_QUALITY);
        }

        async function processAllPhotos() {
            const maxPx = parseInt(photoQuality.value, 10);
            const ids = Object.keys(rawFilesMap);
            imageFilesMap = {};

            if (ids.length === 0) return;

            if (!maxPx) {
                ids.forEach(id => { imageFilesMap[id] = URL.createObjectURL(rawFilesMap[id]); });
                photoStatus.innerHTML = `✅ 已載入 ${ids.length} 張相片（原圖）。`;
                photoStatus.className = "text-xs text-amber-600 mt-2 font-bold";
                return;
            }

            photoQuality.disabled = true;
            photoInput.disabled = true;
            let bytes = 0;

            for (let i = 0; i < ids.length; i++) {
                if (i % 10 === 0) {
                    photoStatus.innerHTML = `⏳ 壓縮相片中… ${i} / ${ids.length}`;
                    photoStatus.className = "text-xs text-green-700 mt-2 font-bold";
                    await new Promise(r => setTimeout(r, 0));
                }
                try {
                    const dataUrl = await shrinkPhoto(rawFilesMap[ids[i]], maxPx);
                    imageFilesMap[ids[i]] = dataUrl;
                    bytes += dataUrl.length * 0.75;
                } catch (err) {
                    imageFilesMap[ids[i]] = URL.createObjectURL(rawFilesMap[ids[i]]);
                }
            }

            photoQuality.disabled = false;
            photoInput.disabled = false;

            const avgKb = Math.round(bytes / ids.length / 1024);
            const totalMb = (bytes / 1048576).toFixed(1);
            photoStatus.innerHTML = `✅ 成功載入 ${ids.length} 張相片（已縮至 ${maxPx}px，合共約 ${totalMb}MB）。`;
            photoStatus.className = "text-xs text-green-600 mt-2 font-bold";
        }

        photoInput.addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            rawFilesMap = {};

            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                if (file.type.startsWith('image/')) {
                    // 自動轉大寫並去除破折號與空格，標準化為 1A01 格式
                    let nameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.')).toUpperCase().trim();
                    let normalizedKey = nameWithoutExt.replace(/[-\s_]/g, '');
                    rawFilesMap[normalizedKey] = file;
                }
            }

            await processAllPhotos();

            if (currentPrintMode === 'batch') {
                renderSelectedClasses();
            } else if (currentPrintMode === 'custom') {
                renderCustomSelectedStudents();
            }
        });

        photoQuality.addEventListener('change', async function() {
            if (Object.keys(rawFilesMap).length === 0) return;
            await processAllPhotos();
            if (currentPrintMode === 'batch') {
                renderSelectedClasses();
            } else if (currentPrintMode === 'custom') {
                renderCustomSelectedStudents();
            }
        });

        // --- Modal 自選學生對話框相關邏輯 ---
        function openStudentPickerModal() {
            studentPickerModal.classList.remove('hidden');
            filterModalStudentList();
        }

        function closeStudentPickerModal() {
            studentPickerModal.classList.add('hidden');
        }

        function filterModalStudentList() {
            const searchText = modalSearchInput.value.trim().toLowerCase();
            const classFilter = modalClassFilter.value;

            const filtered = allStudents.filter(s => {
                const matchClass = !classFilter || s.class === classFilter;
                const matchSearch = !searchText || 
                    s.id.toLowerCase().includes(searchText) ||
                    s.cn.toLowerCase().includes(searchText) ||
                    s.en.toLowerCase().includes(searchText) ||
                    s.class.toLowerCase().includes(searchText);
                return matchClass && matchSearch;
            });

            renderModalTable(filtered);
        }

        function renderModalTable(students) {
            modalStudentTableBody.innerHTML = '';

            students.forEach(s => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition cursor-pointer";
                tr.onclick = (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        const chk = tr.querySelector('input[type="checkbox"]');
                        chk.checked = !chk.checked;
                        toggleStudentSelection(s.id, chk.checked);
                    }
                };

                const isChecked = selectedStudentIds.has(s.id);
                const hasPhoto = !!imageFilesMap[s.id];

                tr.innerHTML = `
                    <td class="p-2 text-center">
                        <input type="checkbox" value="${s.id}" ${isChecked ? 'checked' : ''} 
                               onchange="toggleStudentSelection('${s.id}', this.checked)" class="rounded text-purple-600 focus:ring-purple-500">
                    </td>
                    <td class="p-2 font-bold text-blue-600">${s.id}</td>
                    <td class="p-2 font-medium text-gray-800">${s.cn || '-'}</td>
                    <td class="p-2 text-gray-500 text-xs">${s.en || '-'}</td>
                    <td class="p-2 text-center">
                        ${hasPhoto ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-semibold">✅ 有相片</span>' : '<span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full">⚠️ 缺相片</span>'}
                    </td>
                `;
                modalStudentTableBody.appendChild(tr);
            });

            updateModalCount();
        }

        function toggleStudentSelection(studentId, isChecked) {
            if (isChecked) {
                selectedStudentIds.add(studentId);
            } else {
                selectedStudentIds.delete(studentId);
            }
            updateModalCount();
        }

        function selectAllFilteredStudents(select) {
            const checkboxes = modalStudentTableBody.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(chk => {
                chk.checked = select;
                if (select) {
                    selectedStudentIds.add(chk.value);
                } else {
                    selectedStudentIds.delete(chk.value);
                }
            });
            updateModalCount();
        }

        function toggleSelectAllModal(checked) {
            selectAllFilteredStudents(checked);
        }

        function updateModalCount() {
            const count = selectedStudentIds.size;
            modalSelectedCount.innerText = count;
            selectedCountBadge.innerText = `${count} 人`;
        }

        function applyCustomStudentSelection() {
            closeStudentPickerModal();
            renderCustomSelectedStudents();
        }

        // 渲染自選學生畫布 (模式 B)
        function renderCustomSelectedStudents() {
            printContainer.innerHTML = '';
            missingReportPanel.classList.add('hidden');

            if (selectedStudentIds.size === 0) {
                printContainer.appendChild(emptyState);
                printBtn.disabled = true;
                return;
            }

            const selectedList = allStudents.filter(s => selectedStudentIds.has(s.id));
            selectedList.sort((a, b) => {
                if (a.class === b.class) return a.num - b.num;
                return a.class.localeCompare(b.class);
            });

            renderPagesForStudentList("補發 / 插班自選學生", selectedList);
            generateMissingReport(selectedList, "自選學生");
            printBtn.disabled = false;
        }

        // 渲染選定的多個班別 (模式 A)
        function renderSelectedClasses() {
            printContainer.innerHTML = '';
            missingReportPanel.classList.add('hidden');

            if (selectedClasses.size === 0) {
                printContainer.appendChild(emptyState);
                printBtn.disabled = true;
                return;
            }

            const classesToRender = classesList.filter(c => selectedClasses.has(c));
            let totalStudentsSelected = [];

            classesToRender.forEach(cls => {
                let classStudents = allStudents.filter(s => s.class === cls);
                classStudents.sort((a, b) => a.num - b.num);
                totalStudentsSelected.push(...classStudents);
                renderPagesForStudentList(cls, classStudents);
            });

            const scopeTitle = selectedClasses.size === classesList.length ? "全校" : `所選 ${selectedClasses.size} 班`;
            generateMissingReport(totalStudentsSelected, scopeTitle);
            printBtn.disabled = false;
        }

        // 核心：依傳入的學生清單渲染卡片 (一頁 4 位學生)
        function renderPagesForStudentList(titleLabel, studentList) {
            if (studentList.length === 0) return;

            const totalPages = Math.ceil(studentList.length / STUDENTS_PER_PAGE);

            for (let i = 0; i < totalPages; i++) {
                let pageStudents = studentList.slice(i * STUDENTS_PER_PAGE, (i + 1) * STUDENTS_PER_PAGE);

                let pageDiv = document.createElement('div');
                pageDiv.className = 'a4-page';

                pageStudents.forEach(student => {
                    let passCard = document.createElement('div');
                    passCard.className = 'pass-card';

                    // 左上角級別直角三角形
                    let triangle = document.createElement('div');
                    triangle.className = 'grade-corner-triangle';
                    triangle.style.backgroundColor = getGradeCornerColor(student.class);
                    passCard.appendChild(triangle);

                    // --- 正面 (左半部) ---
                    let frontSide = document.createElement('div');
                    frontSide.className = 'pass-side pass-front';

                    let frontHeader = document.createElement('div');
                    frontHeader.className = 'front-header';

                    if (SCHOOL_LOGO) {
                        let logoImg = document.createElement('img');
                        logoImg.className = 'school-logo';
                        logoImg.src = SCHOOL_LOGO;
                        logoImg.alt = '校徽';
                        frontHeader.appendChild(logoImg);
                    } else {
                        let logoBox = document.createElement('div');
                        logoBox.className = 'school-logo-placeholder';
                        logoBox.innerText = '校徽位置';
                        frontHeader.appendChild(logoBox);
                    }

                    let titleContainer = document.createElement('div');
                    titleContainer.className = 'front-title-container';
                    titleContainer.innerHTML = `
                        <div class="school-title-cn">${SCHOOL_NAME_CN}</div>
                        <div class="school-title-en">${SCHOOL_NAME_EN}</div>
                        <div class="pass-title-line">
                            <span>外 出 午 膳 證</span>
                            <span>Lunch Outside Pass</span>
                        </div>
                        <div class="school-year-text school-year-display">${getSchoolYear()}</div>
                    `;
                    frontHeader.appendChild(titleContainer);
                    frontSide.appendChild(frontHeader);

                    let frontBody = document.createElement('div');
                    frontBody.className = 'front-body';

                    let photoBox = document.createElement('div');
                    photoBox.className = 'photo-box';
                    let img = document.createElement('img');
                    if (imageFilesMap[student.id]) {
                        img.src = imageFilesMap[student.id];
                    } else {
                        img.src = noPhotoSvg;
                    }
                    photoBox.appendChild(img);
                    frontBody.appendChild(photoBox);

                    let infoDiv = document.createElement('div');
                    infoDiv.className = 'student-info';
                    infoDiv.innerHTML = `
                        <div class="class-badge">${student.formStr || ('S' + student.class.charAt(0))}</div>
                        <div>
                            <div class="info-row">
                                <span class="info-label">中文姓名：</span>
                                <span class="info-value">${student.cn || '-'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">English Name：</span>
                                <span class="info-value">${student.en || '-'}</span>
                            </div>
                            <div class="info-row" style="margin-top: 1px;">
                                <span class="info-label">班別及學號 Class & Class No.：</span>
                                <span class="info-value">${student.class} ${student.classNoFormatted}</span>
                            </div>
                        </div>
                    `;
                    frontBody.appendChild(infoDiv);
                    frontSide.appendChild(frontBody);

                    // --- 背面 (右半部) ---
                    let backSide = document.createElement('div');
                    backSide.className = 'pass-side pass-back';

                    let backHeader = document.createElement('div');
                    backHeader.className = 'back-header';
                    backHeader.innerHTML = `
                        <div class="flex justify-between">
                            <div>地址：新界將軍澳唐明街 2 號尚德邨</div>
                            <div>電話：21783223</div>
                        </div>
                        <div>Address: 2 Tong Ming Street, Sheung Tak Estate, Tseung Kwan O, N.T.</div>
                    `;
                    backSide.appendChild(backHeader);

                    let disclaimer = document.createElement('div');
                    disclaimer.className = 'disclaimer-box';
                    disclaimer.innerHTML = `
                        <div style="font-weight: bold; margin-bottom: 1.5mm; text-align: center; color: #1e3a8a; font-size: 8.5pt;">【 外出午膳持證須知 】</div>
                        <div>此證為香港道教聯合會圓玄學院第三中學所有，只限上述持證人使用；如拾獲此證，請即交回校務處。</div>
                        <div style="margin-top:2mm; border-t: 1px dashed #cbd5e1; padding-top: 1.5mm;">This card is the property of HKTA The Yuen Yuen Institute No.3 Secondary School and is not transferable. If found, please return to school office.</div>
                    `;
                    backSide.appendChild(disclaimer);

                    // 組合正面與背面
                    passCard.appendChild(frontSide);
                    passCard.appendChild(backSide);
                    pageDiv.appendChild(passCard);
                });

                printContainer.appendChild(pageDiv);
            }
        }

        // 5. 缺失相片診斷報告
        function generateMissingReport(studentsToCheck, scopeName) {
            missingReportList.innerHTML = '';
            let missingStudents = [];

            studentsToCheck.forEach(student => {
                if (!imageFilesMap[student.id]) {
                    missingStudents.push(student);
                }
            });

            if (missingStudents.length > 0) {
                missingReportSummary.innerText = `在 ${scopeName} 名單中，共有 ${missingStudents.length} 位學生未提供相片。`;
                
                missingStudents.forEach(s => {
                    let li = document.createElement('li');
                    li.innerHTML = `<strong>${s.id}</strong> - ${s.cn} (${s.en})`;
                    missingReportList.appendChild(li);
                });
                
                missingReportPanel.classList.remove('hidden');
            }
        }
    </script>
