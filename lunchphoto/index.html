<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生外出午膳證自動化系統</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        /* ====== 核心 A4 排版引擎 ====== */
        :root {
            --a4-width: 210mm;
            --a4-height: 297mm;
        }

        /* 螢幕預覽模式下的背景 */
        body {
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* 虛擬 A4 紙張的設定 (一頁 4 名學生) */
        .a4-page {
            width: var(--a4-width);
            height: var(--a4-height);
            background: white;
            margin: 20px auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: 10mm 8mm; /* 紙張四邊留白 */
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 3mm;
            page-break-after: always;
            break-after: page;
        }

        .a4-page:last-child {
            page-break-after: auto;
            break-after: auto;
        }

        /* 網頁頁首安全標章 */
        .bento-security-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border: 1px solid #6ee7b7;
            color: #047857;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.35;
        }

        .bento-security-badge svg {
            flex: 0 0 auto;
            width: 18px;
            height: 18px;
        }

        /* 外出午膳證外框 (單個學生區塊) */
        .pass-card {
            width: 100%;
            height: 64mm; /* 一頁4個卡片，固定每張64mm */
            border: 1px solid #1e293b;
            box-sizing: border-box;
            display: flex;
            position: relative;
            background: #ffffff;
            page-break-inside: avoid;
            flex-shrink: 0;
        }

        /* 空卡片佔位 (最後一頁未滿4人時保持排版不變形) */
        .pass-card.empty-slot {
            border: 1px dashed #cbd5e1;
            background: transparent;
            visibility: hidden;
        }

        /* 正面 (左邊) 與 背面 (右邊) 對折分欄 */
        .pass-side {
            width: 50%;
            height: 100%;
            padding: 2.5mm 3mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* 正面 (左邊) */
        .pass-front {
            border-right: 1px dashed #94a3b8; /* 對折虛線 */
        }

        /* 正面頁首 */
        .front-header {
            display: flex;
            align-items: center;
            gap: 2mm;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 1mm;
        }

        .school-logo-box {
            width: 13mm;
            height: 13mm;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .school-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .school-logo-placeholder {
            width: 13mm;
            height: 13mm;
            border: 1px dashed #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6pt;
            color: #94a3b8;
            flex-shrink: 0;
            text-align: center;
        }

        .front-title-container {
            flex: 1;
            text-align: center;
        }

        .school-title-cn {
            color: #dc2626; /* 紅色校名 */
            font-size: 10pt;
            font-weight: bold;
            line-height: 1.1;
        }

        .school-title-en {
            color: #dc2626;
            font-size: 6pt;
            font-weight: 600;
            line-height: 1.1;
        }

        .pass-title-line {
            color: #dc2626;
            font-size: 9pt;
            font-weight: bold;
            margin-top: 0.5mm;
            display: flex;
            justify-content: center;
            gap: 2mm;
        }

        .school-year-text {
            color: #ea580c; /* 橙色學年 */
            font-size: 10pt;
            font-weight: bold;
            text-align: center;
            margin-top: 0.5mm;
        }

        /* 正面主體：相片 + 學生資料 */
        .front-body {
            display: flex;
            align-items: center;
            gap: 3mm;
            margin-top: 1mm;
            flex: 1;
        }

        .photo-box {
            width: 23mm;
            height: 30mm;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            background: #f8fafc;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .student-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding-top: 0.5mm;
            padding-bottom: 0.5mm;
        }

        /* 中間大字級別 (S1 - S6) 上下左右置中並加大 */
        .class-badge {
            color: #059669; /* 綠色大字 */
            font-size: 28pt;
            font-weight: 900;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .info-row {
            font-size: 8pt;
            line-height: 1.25;
            color: #0f172a;
            display: flex;
            align-items: flex-start;
        }

        .info-label {
            font-weight: 600;
            flex-shrink: 0;
            font-size: 8pt;
            white-space: nowrap;
        }

        .info-value {
            font-weight: bold;
            font-size: 9pt;
            white-space: normal;
            word-break: break-word;
        }

        .info-value-cn {
            font-size: 10.5pt; /* 中文姓名更清晰加大 */
        }

        /* 背面 (右邊) */
        .pass-back {
            background-color: #ffffff;
        }

        .back-header {
            color: #1d4ed8; /* 藍色地址與電話 */
            font-size: 6.2pt;
            line-height: 1.25;
            border-bottom: 1px solid #1d4ed8;
            padding-bottom: 1mm;
        }

        .signature-section {
            margin: 1mm 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        /* 放大簽署框，文字靠頂置中 */
        .signature-box {
            width: 92%;
            height: 18mm; /* 框高度由 12mm 放大至 18mm */
            border: 1px solid #000000;
            display: flex;
            align-items: flex-start; /*靠頂 */
            justify-content: center; /* 置中 */
            padding-top: 1.5mm; /* 頂部適當留白 */
            font-size: 8.5pt;
            font-weight: 600;
            color: #000000;
            box-sizing: border-box;
        }

        .disclaimer-box {
            background-color: #e2e8f0;
            border: 1px solid #475569;
            padding: 1.5mm 2mm;
            font-size: 5.5pt;
            line-height: 1.25;
            color: #0f172a;
            border-radius: 2px;
        }

        /* ====== 列印專用設定 ====== */
        @media print {
            .no-print { display: none !important; }
            
            @page {
                size: A4 portrait;
                margin: 0;
            }

            html, body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            #preview-wrap {
                margin: 0 !important;
                padding: 0 !important;
                max-width: none !important;
                width: auto !important;
            }

            #print-container {
                margin: 0 !important;
                padding: 0 !important;
            }

            .a4-page {
                margin: 0 !important;
                box-shadow: none !important;
                border: none !important;
                width: 210mm !important;
                height: 297mm !important;
            }
        }
    </style>
</head>
<body>

    <!-- 控制面板 (列印時自動隱藏) -->
    <div class="no-print bg-white shadow-md p-6 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-800 mb-4 flex items-center justify-between gap-4 flex-wrap">
                <span class="flex items-center">
                    <svg class="w-6 h-6 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2H5zM5 14a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 00-2-2H5z"></path></svg>
                    學生外出午膳證自動化系統
                </span>

                <div class="bento-security-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                    <span>符合資訊素養及網絡安全規範，處理過程純本地進行。</span>
                </div>
            </h1>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 步驟 1: 上傳 Excel -->
                <div class="border rounded-lg p-4 bg-blue-50">
                    <h3 class="font-bold text-blue-800 mb-2">1. 載入全校學生名單 (Excel)</h3>
                    <input type="file" id="excelInput" accept=".xlsx, .xls" class="block w-full text-sm text-slate-500
                        file:mr-4 file:py-2 file:px-4 file:rounded-md
                        file:border-0 file:text-sm file:font-semibold
                        file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer
                    "/>
                    <p class="text-xs text-blue-600 mt-2" id="excelStatus">請確保檔案包含 S1-S6 分頁，資料位於 D-G 欄。</p>
                </div>

                <!-- 步驟 2: 選擇相片資料夾 -->
                <div class="border rounded-lg p-4 bg-green-50">
                    <h3 class="font-bold text-green-800 mb-2">2. 載入相片主資料夾</h3>
                    <input type="file" id="photoInput" webkitdirectory directory multiple class="block w-full text-sm text-slate-500
                        file:mr-4 file:py-2 file:px-4 file:rounded-md
                        file:border-0 file:text-sm file:font-semibold
                        file:bg-green-600 file:text-white hover:file:bg-green-700 cursor-pointer
                    "/>
                    <div class="flex items-center gap-2 mt-2">
                        <label for="photoQuality" class="text-xs font-semibold text-green-800 whitespace-nowrap">相片解析度</label>
                        <select id="photoQuality" class="flex-1 text-xs p-1 border border-green-300 rounded bg-white">
                            <option value="280">細 — 檔案最細 (280px)</option>
                            <option value="400" selected>標準 — 300dpi 列印 (400px)</option>
                            <option value="600">高 — 較清晰 (600px)</option>
                            <option value="0">原圖 — 不壓縮 (檔案極大)</option>
                        </select>
                    </div>
                    <p class="text-xs text-green-600 mt-2" id="photoStatus">檔名必須為「班別-班號.jpg」(如 1A-01.jpg)。</p>
                </div>

                <!-- 步驟 3: 選擇班別與列印 -->
                <div class="border rounded-lg p-4 bg-purple-50 flex flex-col justify-between">
                    <div>
                        <h3 class="font-bold text-purple-800 mb-2">3. 預覽與列印</h3>
                        
                        <!-- 模式切換頁籤 -->
                        <div class="flex mb-3 bg-purple-100 p-1 rounded-md text-xs font-semibold">
                            <button type="button" id="modeClassBtn" onclick="switchSelectionMode('class')" class="flex-1 py-1 px-2 rounded bg-purple-600 text-white shadow-sm transition">
                                按班別 / 全校
                            </button>
                            <button type="button" id="modeCustomBtn" onclick="switchSelectionMode('custom')" class="flex-1 py-1 px-2 rounded text-purple-800 hover:bg-purple-200 transition">
                                自選學生 (補證/插班)
                            </button>
                        </div>

                        <div class="flex items-center gap-2 mb-2">
                            <label for="schoolYear" class="text-xs font-semibold text-purple-800 whitespace-nowrap">學年</label>
                            <input type="text" id="schoolYear" value="2024 - 2025" placeholder="2024 - 2025" maxlength="11"
                                class="flex-1 p-1 text-sm text-center border border-gray-300 rounded-md bg-white font-semibold text-amber-700" />
                        </div>

                        <!-- 模式一：原班別下拉選單 -->
                        <div id="classModeContainer">
                            <select id="classSelect" disabled class="block w-full p-2 mb-2 border border-gray-300 rounded-md bg-white">
                                <option value="">請先載入 Excel 名單</option>
                            </select>
                        </div>

                        <!-- 模式二：自選學生觸發按鈕 -->
                        <div id="customModeContainer" class="hidden mb-2">
                            <button type="button" id="openPickerBtn" disabled onclick="openStudentPickerModal()" class="w-full bg-white border border-purple-300 text-purple-800 text-xs font-bold py-2 px-3 rounded hover:bg-purple-100 flex items-center justify-between shadow-sm transition disabled:bg-gray-100 disabled:text-gray-400 disabled:border-gray-200 disabled:cursor-not-allowed">
                                <span class="flex items-center">
                                    <svg class="w-4 h-4 mr-1.5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                    搜尋與勾選特定學生
                                </span>
                                <span id="selectedCountBadge" class="bg-purple-600 text-white rounded-full px-2 py-0.5 text-[10px]">0 人</span>
                            </button>
                        </div>
                    </div>
                    <button id="printBtn" disabled onclick="window.print()" class="w-full bg-purple-600 text-white font-bold py-2 px-4 rounded disabled:bg-gray-400 disabled:cursor-not-allowed hover:bg-purple-700 transition">
                        列印 / 匯出 PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 預覽區域與報告面板 -->
    <div id="preview-wrap" class="max-w-6xl mx-auto mt-6">

        <!-- 缺失相片報告面板 (列印時隱藏) -->
        <div id="missingReportPanel" class="no-print hidden mb-6 bg-red-50 border border-red-200 rounded-lg p-4 shadow-sm">
            <h3 class="text-lg font-bold text-red-700 mb-2 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                缺失相片報告
            </h3>
            <p class="text-sm text-red-600 mb-3" id="missingReportSummary"></p>
            <div class="max-h-40 overflow-y-auto bg-white rounded border border-red-100 p-2">
                <ul id="missingReportList" class="list-disc pl-5 text-sm text-gray-700 space-y-1">
                    <!-- 缺失名單動態生成 -->
                </ul>
            </div>
        </div>

        <!-- 實體 A4 畫布區 -->
        <div id="print-container" class="pb-20">
            <div id="empty-state" class="no-print flex flex-col items-center justify-center pt-20 text-gray-400">
                <svg class="w-20 h-20 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <p class="text-lg">載入資料後，實體 A4 外出午膳證預覽將在此顯示</p>
            </div>
        </div>
    </div>

    <!-- 自選學生 Modal 彈出視窗 -->
    <div id="studentPickerModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden no-print">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden m-4 border border-slate-200">
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <div>
                    <h3 class="text-lg font-bold text-slate-800 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        選擇自訂學生名單 (跨班 / 補發 / 插班)
                    </h3>
                    <p class="text-xs text-slate-500 mt-0.5">搜尋或勾選學生後，系統會將選中學生連續排版（一頁4張，不浪費紙張）。</p>
                </div>
                <button type="button" onclick="closeStudentPickerModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-200 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Modal Filter Bar -->
            <div class="p-4 border-b border-slate-100 bg-white grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="relative">
                    <input type="text" id="modalSearchInput" oninput="filterModalStudentList()" placeholder="搜尋姓名、班別、學號..." 
                        class="w-full pl-9 pr-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none" />
                    <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>

                <div>
                    <select id="modalClassFilter" onchange="filterModalStudentList()" class="w-full py-1.5 px-3 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none bg-white">
                        <option value="">全部班別</option>
                    </select>
                </div>

                <div class="flex gap-2">
                    <button type="button" onclick="toggleSelectFilteredStudents(true)" class="flex-1 text-xs bg-slate-100 hover:bg-purple-100 text-slate-700 hover:text-purple-700 font-semibold py-1.5 px-2 rounded-lg border border-slate-200 transition">
                        全選目前篩選
                    </button>
                    <button type="button" onclick="clearSelectedStudents()" class="text-xs bg-slate-100 hover:bg-red-100 text-slate-700 hover:text-red-700 font-semibold py-1.5 px-3 rounded-lg border border-slate-200 transition">
                        清空
                    </button>
                </div>
            </div>

            <!-- Modal Student List -->
            <div class="flex-1 overflow-y-auto p-4 bg-slate-50/50">
                <div id="modalStudentGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                    <!-- 動態生成學生勾選卡片 -->
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-slate-100 bg-white flex items-center justify-between">
                <span class="text-sm font-semibold text-slate-700">
                    已選擇：<strong id="modalSelectedCount" class="text-purple-600 text-base">0</strong> 人
                </span>
                <div class="flex gap-3">
                    <button type="button" onclick="closeStudentPickerModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg font-semibold transition">
                        取消
                    </button>
                    <button type="button" onclick="confirmCustomSelection()" class="px-5 py-2 text-sm bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-lg shadow-md transition">
                        確認並生成預覽
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 缺照片的預設佔位 SVG

        // Helper: 取得當前輸入的學年
        function getSchoolYear() {
            return (schoolYear.value || '').trim();
        }

        // 監聽學年輸入，動態更新預覽
        schoolYear.addEventListener('input', function() {
            const v = getSchoolYear();
            document.querySelectorAll('.school-year-display').forEach(el => { el.innerText = v; });
        });

        // 1. 處理 Excel 上傳
        excelInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    allStudents = [];
                    const targetSheets = ['S1', 'S2', 'S3', 'S4', 'S5', 'S6'];
                    
                    targetSheets.forEach(sheetName => {
                        if (workbook.Sheets[sheetName]) {
                            const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: "A", defval: ""});
                            
                            json.forEach((row, index) => {
                                let rawD = String(row['D']).trim().toLowerCase();
                                if (rawD === '班別' || rawD === 'class' || rawD === 'd') return;

                                let cls = String(row['D']).trim();
                                let num = String(row['E']).trim();
                                let enName = String(row['F']).trim();
                                let cnName = String(row['G']).trim();

                                if (cls && num && !isNaN(parseInt(num))) {
                                    let numPadded = parseInt(num).toString().padStart(2, '0');
                                    let studentId = `${cls.toUpperCase()}-${numPadded}`;
                                    
                                    allStudents.push({
                                        class: cls.toUpperCase(),
                                        num: parseInt(num),
                                        classNoFormatted: numPadded,
                                        id: studentId,
                                        en: enName,
                                        cn: cnName
                                    });
                                }
                            });
                        }
                    });

                    if (allStudents.length === 0) {
                        alert("在 S1-S6 分頁的 D-G 欄中找不到有效的學生資料！請檢查 Excel 格式。");
                        return;
                    }

                    classesList = [...new Set(allStudents.map(s => s.class))].sort();
                    
                    // 更新模式一：班別下拉選單
                    classSelect.innerHTML = '<option value="">-- 請選擇要預覽的班別 --</option>';
                    
                    let allOption = document.createElement('option');
                    allOption.value = "ALL";
                    allOption.innerText = `🌟 全校 (共 ${classesList.length} 班, ${allStudents.length} 人)`;
                    classSelect.appendChild(allOption);

                    classesList.forEach(cls => {
                        let option = document.createElement('option');
                        option.value = cls;
                        let count = allStudents.filter(s => s.class === cls).length;
                        option.innerText = `${cls} 班 (${count} 人)`;
                        classSelect.appendChild(option);
                    });

                    // 更新 Modal 內的班別篩選器
                    modalClassFilter.innerHTML = '<option value="">全部班別</option>';
                    classesList.forEach(cls => {
                        let option = document.createElement('option');
                        option.value = cls;
                        option.innerText = `${cls} 班`;
                        modalClassFilter.appendChild(option);
                    });

                    classSelect.disabled = false;
                    openPickerBtn.disabled = false;
                    excelStatus.innerHTML = `✅ 成功讀取 ${allStudents.length} 位學生資料。`;
                    excelStatus.className = "text-xs text-green-600 mt-2 font-bold";
                    
                    checkReadyState();

                } catch (error) {
                    console.error(error);
                    alert("讀取 Excel 失敗，請確保檔案格式正確。");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // 綁定班別選單變更事件
        classSelect.addEventListener('change', function(e) {
            handleSelection(e.target.value);
        });

        // 2. 相片縮圖處理
        async function shrinkPhoto(file, maxPx) {
            let bmp;
            try {
                bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
            } catch (err) {
                bmp = await createImageBitmap(file);
            }
            const scale = Math.min(1, maxPx / Math.max(bmp.width, bmp.height));
            const w = Math.max(1, Math.round(bmp.width * scale));
            const h = Math.max(1, Math.round(bmp.height * scale));

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(bmp, 0, 0, w, h);
            if (bmp.close) bmp.close();

            return canvas.toDataURL('image/jpeg', JPEG_QUALITY);
        }

        async function processAllPhotos() {
            const maxPx = parseInt(photoQuality.value, 10);
            const ids = Object.keys(rawFilesMap);
            imageFilesMap = {};

            if (ids.length === 0) return;

            if (!maxPx) {
                ids.forEach(id => { imageFilesMap[id] = URL.createObjectURL(rawFilesMap[id]); });
                photoStatus.innerHTML = `✅ 已載入 ${ids.length} 張相片（原圖）。`;
                photoStatus.className = "text-xs text-amber-600 mt-2 font-bold";
                return;
            }

            photoQuality.disabled = true;
            photoInput.disabled = true;
            let bytes = 0;

            for (let i = 0; i < ids.length; i++) {
                if (i % 10 === 0) {
                    photoStatus.innerHTML = `⏳ 壓縮相片中… ${i} / ${ids.length}`;
                    photoStatus.className = "text-xs text-green-700 mt-2 font-bold";
                    await new Promise(r => setTimeout(r, 0));
                }
                try {
                    const dataUrl = await shrinkPhoto(rawFilesMap[ids[i]], maxPx);
                    imageFilesMap[ids[i]] = dataUrl;
                    bytes += dataUrl.length * 0.75;
                } catch (err) {
                    imageFilesMap[ids[i]] = URL.createObjectURL(rawFilesMap[ids[i]]);
                }
            }

            photoQuality.disabled = false;
            photoInput.disabled = false;

            const avgKb = Math.round(bytes / ids.length / 1024);
            const totalMb = (bytes / 1048576).toFixed(1);
            photoStatus.innerHTML = `✅ 成功載入 ${ids.length} 張相片（已縮至 ${maxPx}px，合共約 ${totalMb}MB）。`;
            photoStatus.className = "text-xs text-green-600 mt-2 font-bold";
        }

        photoInput.addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            rawFilesMap = {};

            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                if (file.type.startsWith('image/')) {
                    let nameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.')).toUpperCase();
                    rawFilesMap[nameWithoutExt] = file;
                }
            }

            await processAllPhotos();
            checkReadyState();

            if (currentMode === 'class' && classSelect.value) {
                handleSelection(classSelect.value);
            } else if (currentMode === 'custom') {
                renderCustomSelectionPreview();
            }
        });

        photoQuality.addEventListener('change', async function() {
            if (Object.keys(rawFilesMap).length === 0) return;
            await processAllPhotos();
            if (currentMode === 'class' && classSelect.value) {
                handleSelection(classSelect.value);
            } else if (currentMode === 'custom') {
                renderCustomSelectionPreview();
            }
        });

        function checkReadyState() {
            if (allStudents.length > 0) {
                classSelect.disabled = false;
                openPickerBtn.disabled = false;
            }
        }

        // ===== 模式切換邏輯 =====
        function switchSelectionMode(mode) {
            currentMode = mode;
            if (mode === 'class') {
                modeClassBtn.className = "flex-1 py-1 px-2 rounded bg-purple-600 text-white shadow-sm transition";
                modeCustomBtn.className = "flex-1 py-1 px-2 rounded text-purple-800 hover:bg-purple-200 transition";
                classModeContainer.classList.remove('hidden');
                customModeContainer.classList.add('hidden');
                handleSelection(classSelect.value);
            } else {
                modeCustomBtn.className = "flex-1 py-1 px-2 rounded bg-purple-600 text-white shadow-sm transition";
                modeClassBtn.className = "flex-1 py-1 px-2 rounded text-purple-800 hover:bg-purple-200 transition";
                classModeContainer.classList.add('hidden');
                customModeContainer.classList.remove('hidden');
                renderCustomSelectionPreview();
            }
        }

        // ===== 自選學生 Modal 開關與選擇器 =====
        function openStudentPickerModal() {
            modalSearchInput.value = '';
            modalClassFilter.value = '';
            filterModalStudentList();
            updateModalSelectedCount();
            studentPickerModal.classList.remove('hidden');
        }

        function closeStudentPickerModal() {
            studentPickerModal.classList.add('hidden');
        }

        function filterModalStudentList() {
            const searchKw = modalSearchInput.value.trim().toLowerCase();
            const classFilter = modalClassFilter.value;

            const filtered = allStudents.filter(s => {
                const matchesClass = !classFilter || s.class === classFilter;
                const matchesKw = !searchKw || 
                    s.id.toLowerCase().includes(searchKw) || 
                    s.cn.toLowerCase().includes(searchKw) || 
                    s.en.toLowerCase().includes(searchKw);
                return matchesClass && matchesKw;
            });

            renderModalStudentGrid(filtered);
        }

        function renderModalStudentGrid(students) {
            modalStudentGrid.innerHTML = '';
            if (students.length === 0) {
                modalStudentGrid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400 text-sm">找不到符合條件的學生</div>`;
                return;
            }

            students.forEach(student => {
                const isChecked = selectedStudentIds.has(student.id);
                const hasPhoto = !!imageFilesMap[student.id];

                const item = document.createElement('label');
                item.className = `flex items-center gap-2.5 p-2.5 rounded-lg border cursor-pointer transition select-none ${
                    isChecked ? 'bg-purple-50 border-purple-400 shadow-sm' : 'bg-white border-slate-200 hover:border-purple-200'
                }`;

                item.innerHTML = `
                    <input type="checkbox" value="${student.id}" ${isChecked ? 'checked' : ''} 
                        onchange="toggleStudentSelection('${student.id}', this.checked)"
                        class="w-4 h-4 text-purple-600 rounded border-slate-300 focus:ring-purple-500" />
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-xs ${isChecked ? 'text-purple-900' : 'text-slate-800'}">${student.id}</span>
                            <span class="text-[10px] px-1.5 py-0.5 rounded ${hasPhoto ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'} font-medium">
                                ${hasPhoto ? '有相片' : '缺相片'}
                            </span>
                        </div>
                        <div class="text-xs font-semibold text-slate-700 truncate">${student.cn}</div>
                        <div class="text-[10px] text-slate-400 truncate">${student.en || '-'}</div>
                    </div>
                `;
                modalStudentGrid.appendChild(item);
            });
        }

        function toggleStudentSelection(studentId, isChecked) {
            if (isChecked) {
                selectedStudentIds.add(studentId);
            } else {
                selectedStudentIds.delete(studentId);
            }
            updateModalSelectedCount();
        }

        function toggleSelectFilteredStudents(selectState) {
            const searchKw = modalSearchInput.value.trim().toLowerCase();
            const classFilter = modalClassFilter.value;

            allStudents.forEach(s => {
                const matchesClass = !classFilter || s.class === classFilter;
                const matchesKw = !searchKw || 
                    s.id.toLowerCase().includes(searchKw) || 
                    s.cn.toLowerCase().includes(searchKw) || 
                    s.en.toLowerCase().includes(searchKw);
                
                if (matchesClass && matchesKw) {
                    if (selectState) selectedStudentIds.add(s.id);
                    else selectedStudentIds.delete(s.id);
                }
            });

            filterModalStudentList();
            updateModalSelectedCount();
        }

        function clearSelectedStudents() {
            selectedStudentIds.clear();
            filterModalStudentList();
            updateModalSelectedCount();
        }

        function updateModalSelectedCount() {
            const count = selectedStudentIds.size;
            modalSelectedCount.innerText = count;
            selectedCountBadge.innerText = `${count} 人`;
        }

        function confirmCustomSelection() {
            closeStudentPickerModal();
            renderCustomSelectionPreview();
        }

        function renderCustomSelectionPreview() {
            printContainer.innerHTML = '';
            missingReportPanel.classList.add('hidden');

            if (selectedStudentIds.size === 0) {
                printContainer.appendChild(emptyState);
                printBtn.disabled = true;
                return;
            }

            // 選出的學生依照班別、學號排序
            const selectedStudents = allStudents
                .filter(s => selectedStudentIds.has(s.id))
                .sort((a, b) => {
                    if (a.class === b.class) return a.num - b.num;
                    return a.class.localeCompare(b.class);
                });

            renderContinuousPages(selectedStudents);
            generateMissingReport(selectedStudents, `自選名單 (共 ${selectedStudents.length} 人)`);
            printBtn.disabled = false;
        }

        function handleSelection(selection) {
            if (currentMode === 'custom') {
                renderCustomSelectionPreview();
                return;
            }

            printContainer.innerHTML = '';
            missingReportPanel.classList.add('hidden');

            if (!selection) {
                printContainer.appendChild(emptyState);
                printBtn.disabled = true;
                return;
            }

            let studentsToRender = [];
            
            if (selection === "ALL") {
                studentsToRender = [...allStudents].sort((a, b) => {
                    if (a.class === b.class) return a.num - b.num;
                    return a.class.localeCompare(b.class);
                });
                
                classesList.forEach(cls => {
                    let classStudents = studentsToRender.filter(s => s.class === cls);
                    renderPagesForClass(cls, classStudents);
                });
            } else {
                studentsToRender = allStudents.filter(s => s.class === selection);
                studentsToRender.sort((a, b) => a.num - b.num);
                renderPagesForClass(selection, studentsToRender);
            }

            generateMissingReport(studentsToRender, selection === "ALL" ? "全校" : `${selection}班`);
            printBtn.disabled = false;
        }

        // 自選模式下連續排版（一頁 4 位，可跨班連印）
        function renderContinuousPages(students) {
            if (students.length === 0) return;

            const totalPages = Math.ceil(students.length / STUDENTS_PER_PAGE);

            for (let i = 0; i < totalPages; i++) {
                let pageStudents = students.slice(i * STUDENTS_PER_PAGE, (i + 1) * STUDENTS_PER_PAGE);

                let pageDiv = document.createElement('div');
                pageDiv.className = 'a4-page';

                pageStudents.forEach(student => {
                    let passCard = createPassCardElement(student);
                    pageDiv.appendChild(passCard);
                });

                // 補滿剩餘空位
                const emptySlotsCount = STUDENTS_PER_PAGE - pageStudents.length;
                for (let j = 0; j < emptySlotsCount; j++) {
                    let emptyCard = document.createElement('div');
                    emptyCard.className = 'pass-card empty-slot';
                    pageDiv.appendChild(emptyCard);
                }

                printContainer.appendChild(pageDiv);
            }
        }

        // 生成單一學生卡片 DOM 的獨立函式
        function createPassCardElement(student) {
            let passCard = document.createElement('div');
            passCard.className = 'pass-card';

            // --- 正面 (左半部) ---
            let frontSide = document.createElement('div');
            frontSide.className = 'pass-side pass-front';

            let frontHeader = document.createElement('div');
            frontHeader.className = 'front-header';

            let logoBox = document.createElement('div');
            logoBox.className = 'school-logo-box';
            if (SCHOOL_LOGO && SCHOOL_LOGO.trim() !== "") {
                let logoImg = document.createElement('img');
                logoImg.className = 'school-logo';
                logoImg.src = SCHOOL_LOGO;
                logoImg.alt = '校徽';
                logoBox.appendChild(logoImg);
            } else {
                let placeholder = document.createElement('div');
                placeholder.className = 'school-logo-placeholder';
                placeholder.innerText = '校徽位置';
                logoBox.appendChild(placeholder);
            }
            frontHeader.appendChild(logoBox);

            let titleContainer = document.createElement('div');
            titleContainer.className = 'front-title-container';
            titleContainer.innerHTML = `
                <div class="school-title-cn">${SCHOOL_NAME_CN}</div>
                <div class="school-title-en">${SCHOOL_NAME_EN}</div>
                <div class="pass-title-line">
                    <span>外 出 午 膳 證</span>
                    <span>Lunch Outside Pass</span>
                </div>
                <div class="school-year-text school-year-display">${getSchoolYear()}</div>
            `;
            frontHeader.appendChild(titleContainer);
            frontSide.appendChild(frontHeader);

            // 正面 Body
            let frontBody = document.createElement('div');
            frontBody.className = 'front-body';

            let photoBox = document.createElement('div');
            photoBox.className = 'photo-box';
            let img = document.createElement('img');
            
            if (imageFilesMap[student.id]) {
                img.src = imageFilesMap[student.id];
            } else {
                img.src = noPhotoSvg;
            }
            photoBox.appendChild(img);
            frontBody.appendChild(photoBox);

            let formLevel = "";
            if (student.class) {
                let match = student.class.match(/\d/);
                formLevel = match ? "S" + match[0] : student.class;
            }

            let infoDiv = document.createElement('div');
            infoDiv.className = 'student-info';
            infoDiv.innerHTML = `
                <div class="class-badge">${formLevel}</div>
                <div class="space-y-0.5">
                    <div class="info-row">
                        <span class="info-label">中文姓名 ：</span>
                        <span class="info-value info-value-cn">${student.cn || '-'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">English Name ：</span>
                        <span class="info-value">${student.en || '-'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">班別及學號 Class &amp; Class No. ：</span>
                        <span class="info-value">${student.class} ${student.classNoFormatted}</span>
                    </div>
                </div>
            `;
            frontBody.appendChild(infoDiv);
            frontSide.appendChild(frontBody);

            // --- 背面 (右半部) ---
            let backSide = document.createElement('div');
            backSide.className = 'pass-side pass-back';

            let backHeader = document.createElement('div');
            backHeader.className = 'back-header';
            backHeader.innerHTML = `
                <div class="flex justify-between">
                    <div>地址：新界將軍澳唐明街 2 號尚德邨</div>
                    <div>電話：21783223</div>
                </div>
                <div>Address: 2 Tong Ming Street, Sheung Tak Estate, Tseung Kwan O, N.T.</div>
                <div>Tel: 21783223</div>
            `;
            backSide.appendChild(backHeader);

            let sigSection = document.createElement('div');
            sigSection.className = 'signature-section';
            sigSection.innerHTML = `
                <div class="signature-box">
                    學生簽署 &nbsp; Student's Signature
                </div>
            `;
            backSide.appendChild(sigSection);

            let disclaimer = document.createElement('div');
            disclaimer.className = 'disclaimer-box';
            disclaimer.innerHTML = `
                <div>此證為香港道教聯合會圓玄學院第三中學所有，只限上述持證人使用；如拾獲此證，請即交回校務處。</div>
                <div style="margin-top:0.5mm;">This card is the property of HKTA The Yuen Yuen Institute No.3 Secondary School and is not transferable. If found, please return to school office.</div>
            `;
            backSide.appendChild(disclaimer);

            passCard.appendChild(frontSide);
            passCard.appendChild(backSide);
            return passCard;
        }

        // 3. 渲染按班別的外出午膳證
        function renderPagesForClass(cls, classStudents) {
            if (classStudents.length === 0) return;

            const totalPages = Math.ceil(classStudents.length / STUDENTS_PER_PAGE);

            for (let i = 0; i < totalPages; i++) {
                let pageStudents = classStudents.slice(i * STUDENTS_PER_PAGE, (i + 1) * STUDENTS_PER_PAGE);

                let pageDiv = document.createElement('div');
                pageDiv.className = 'a4-page';

                pageStudents.forEach(student => {
                    let passCard = createPassCardElement(student);
                    pageDiv.appendChild(passCard);
                });

                const emptySlotsCount = STUDENTS_PER_PAGE - pageStudents.length;
                for (let j = 0; j < emptySlotsCount; j++) {
                    let emptyCard = document.createElement('div');
                    emptyCard.className = 'pass-card empty-slot';
                    pageDiv.appendChild(emptyCard);
                }

                printContainer.appendChild(pageDiv);
            }
        }

        // 4. 缺失相片診斷報告
        function generateMissingReport(studentsToCheck, scopeName) {
            missingReportList.innerHTML = '';
            let missingStudents = [];

            studentsToCheck.forEach(student => {
                if (!imageFilesMap[student.id]) {
                    missingStudents.push(student);
                }
            });

            if (missingStudents.length > 0) {
                missingReportSummary.innerText = `在 ${scopeName} 名單中，共有 ${missingStudents.length} 位學生未提供相片。`;
                
                missingStudents.forEach(s => {
                    let li = document.createElement('li');
                    li.innerHTML = `<strong>${s.id}</strong> - ${s.cn} (${s.en})`;
                    missingReportList.appendChild(li);
                });
                
                missingReportPanel.classList.remove('hidden');
            }
        }
    </script>
</body>
