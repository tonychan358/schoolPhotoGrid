<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生相片電子格仔表自動化系統</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        /* ====== 核心 A4 排版引擎 ====== */
        :root {
            --a4-width: 210mm;
            --a4-height: 297mm;
        }

        /* 螢幕預覽模式下的背景 */
        body {
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* 虛擬 A4 紙張的設定
           ⚠️ 用 flex column：header 佔實際高度，grid 食晒剩餘空間，
              保證內容永遠啱啱好 297mm，唔會爆出紙外被 overflow 剪走。 */
        .a4-page {
            width: var(--a4-width);
            height: var(--a4-height);
            background: white;
            margin: 20px auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: 12mm 10mm; /* 設定紙張四邊留白 */
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            page-break-after: always; /* 列印時確保每張虛擬紙都是獨立一頁 */
            break-after: page;
        }

        /* 最後一頁唔好再分頁，否則尾部會多出一張白紙 */
        .a4-page:last-child {
            page-break-after: auto;
            break-after: auto;
        }

        /* ====== 網頁頁首安全標章（螢幕用；列印時隨控制面板一併隱藏）======
           用內嵌 SVG 而唔用 Font Awesome：本工具定位係本機離線運作，
           冇必要為咗一個圖示再拉多一個 CDN。 */
        .bento-security-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border: 1px solid #6ee7b7;
            color: #047857;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.35;
            letter-spacing: 0.2px;
            max-width: 460px;
        }

        .bento-security-badge svg {
            flex: 0 0 auto;
            width: 18px;
            height: 18px;
        }

        /* ====== 頁首（版式 B — 緊湊橫排）======
           校徽靠左 ┃ 校名 + 學年置中 ┃ 班別 + 頁碼靠右，全部收成一條 band，
           高度最細，留最多空間畀相片格。 */
        .page-header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 3mm;
            text-align: left;
            color: #1e3a8a;
            border-bottom: 2px solid #94a3b8;
            padding-bottom: 3mm;
            margin-bottom: 4mm;
        }

        /* 校徽：靠左，唔會被壓縮 */
        .school-logo {
            flex: 0 0 auto;
            height: 15mm;
            width: auto;
        }

        /* 中間區：校名 + 學年，置中 */
        .hdr-mid {
            flex: 1 1 auto;
            text-align: center;
        }

        .school-name {
            font-size: 16pt;
            font-weight: bold;
            letter-spacing: 0.5px;
            line-height: 1.15;
        }

        .school-year {
            font-size: 11pt;
            font-weight: 600;
            color: #475569;
            letter-spacing: 1px;
            margin-top: 0.5mm;
        }

        /* 右邊：班別標題 + 頁碼 */
        .sheet-title {
            flex: 0 0 auto;
            font-size: 12pt;
            font-weight: bold;
            color: #1e3a8a;
            text-align: right;
            line-height: 1.3;
            white-space: nowrap;
        }

        /* 格仔表網格：嚴格固定 4 欄 5 列，高度自動填滿剩餘空間 */
        .student-grid {
            flex: 1 1 auto;
            min-height: 0; /* 關鍵：容許 grid 縮細，唔會撐爆 flex 容器 */
            display: grid;
            /* minmax(0,1fr) 好重要：純 1fr 的最小值係 auto，
               行高會被卡片內容撐大，令 grid 爆出紙外被 overflow 剪走。 */
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: repeat(5, minmax(0, 1fr)); /* 五行平分剩餘高度 */
            gap: 4mm 4mm;
        }

        /* 學生卡片 (單一個格仔) */
        .student-card {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 2mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            background-color: #ffffff;
            min-height: 0;
            overflow: hidden;
        }

        .student-card.empty-slot {
            border: 1px dashed #cbd5e1;
            background-color: transparent;
        }

        /* 照片區域：高度彈性，食晒卡片內剩餘空間。
           用 position:relative + 絕對定位的 img，令相片的原生尺寸
           完全唔會反過來撐大卡片（否則 100x120px 的圖會頂住唔肯縮）。 */
        .photo-area {
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
            width: 100%;
            margin-bottom: 1.5mm;
            overflow: hidden;
        }

        .photo-area img {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* 確保照片比例不變形 */
            border-radius: 4px;
        }

        /* 文字資訊區域 */
        .text-area {
            flex: 0 0 auto;
            text-align: center;
            width: 100%;
            line-height: 1.2;
        }

        .st-id { font-size: 11pt; font-weight: bold; color: #2563eb; }
        .st-cn { font-size: 13pt; font-weight: bold; margin-top: 2px; }
        .st-en { font-size: 9pt; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

        /* ====== 列印專用設定 ====== */
        @media print {
            /* 隱藏所有不需列印的介面元素 */
            .no-print { display: none !important; }
            
            /* 重設頁面與 A4 紙張屬性 */
            @page {
                size: A4 portrait;
                margin: 0; /* 讓 .a4-page 的 padding 來控制邊界 */
            }
            html, body {
                background: white;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* ★ 走位元兇：預覽區外框的 Tailwind mt-6 (24px) / pb-20 (80px)
               喺列印時依然生效，會將第一張 A4 向下推 24px，
               令第一頁底部溢出到下一張紙（多出一頁灰白紙 + 尾行被切）。
               列印時必須全部歸零。 */
            #preview-wrap {
                margin: 0 !important;
                padding: 0 !important;
                max-width: none !important;
                width: auto !important;
            }
            #print-container {
                margin: 0 !important;
                padding: 0 !important;
            }
            .a4-page {
                margin: 0 !important;
                box-shadow: none; /* 列印時移除陰影 */
                border: none;
            }
        }
    </style>
</head>
<body>

    <!-- 頂部控制面板 (列印時會自動隱藏) -->
    <div class="no-print bg-white shadow-md p-6 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-800 mb-4 flex items-center justify-between gap-4 flex-wrap">
                <span class="flex items-center">
                    <svg class="w-6 h-6 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    學生相片電子格仔表系統
                </span>

                <div class="bento-security-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                    <span data-i18n="security">符合資訊素養及網絡安全規範，處理過程純本地處理。</span>
                </div>
            </h1>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 步驟 1: 上傳 Excel -->
                <div class="border rounded-lg p-4 bg-blue-50">
                    <h3 class="font-bold text-blue-800 mb-2">1. 載入全校學生名單 (Excel)</h3>
                    <input type="file" id="excelInput" accept=".xlsx, .xls" class="block w-full text-sm text-slate-500
                        file:mr-4 file:py-2 file:px-4 file:rounded-md
                        file:border-0 file:text-sm file:font-semibold
                        file:bg-blue-600 file:text-white hover:file:bg-blue-700
                    "/>
                    <p class="text-xs text-blue-600 mt-2" id="excelStatus">請確保檔案包含 S1-S6 分頁，資料位於 D-G 欄。</p>
                </div>

                <!-- 步驟 2: 選擇相片資料夾 -->
                <div class="border rounded-lg p-4 bg-green-50">
                    <h3 class="font-bold text-green-800 mb-2">2. 載入相片主資料夾</h3>
                    <input type="file" id="photoInput" webkitdirectory directory multiple class="block w-full text-sm text-slate-500
                        file:mr-4 file:py-2 file:px-4 file:rounded-md
                        file:border-0 file:text-sm file:font-semibold
                        file:bg-green-600 file:text-white hover:file:bg-green-700
                    "/>
                    <div class="flex items-center gap-2 mt-2">
                        <label for="photoQuality" class="text-xs font-semibold text-green-800 whitespace-nowrap">相片解析度</label>
                        <select id="photoQuality" class="flex-1 text-xs p-1 border border-green-300 rounded bg-white">
                            <option value="280">細 — 檔案最細 (280px)</option>
                            <option value="400" selected>標準 — 300dpi 列印 (400px)</option>
                            <option value="600">高 — 較清晰 (600px)</option>
                            <option value="0">原圖 — 不壓縮 (檔案極大)</option>
                        </select>
                    </div>
                    <p class="text-xs text-green-600 mt-2" id="photoStatus">檔名必須為「班別-班號.jpg」(如 1A-01.jpg)。</p>
                </div>

                <!-- 步驟 3: 選擇班別與列印 -->
                <div class="border rounded-lg p-4 bg-purple-50 flex flex-col justify-between">
                    <div>
                        <h3 class="font-bold text-purple-800 mb-2">3. 預覽與列印</h3>
                        <div class="flex items-center gap-2 mb-2">
                            <label for="schoolYear" class="text-xs font-semibold text-purple-800 whitespace-nowrap">學年</label>
                            <input type="text" id="schoolYear" value="2026-2027" placeholder="xxxx-xxxx" maxlength="9"
                                class="flex-1 p-1 text-sm text-center border border-gray-300 rounded-md bg-white" />
                        </div>
                        <select id="classSelect" disabled class="block w-full p-2 mb-2 border border-gray-300 rounded-md bg-white">
                            <option value="">請先載入 Excel 名單</option>
                        </select>
                    </div>
                    <button id="printBtn" disabled onclick="window.print()" class="w-full bg-purple-600 text-white font-bold py-2 px-4 rounded disabled:bg-gray-400 disabled:cursor-not-allowed hover:bg-purple-700 transition">
                        列印 / 匯出 PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 預覽區域與報告面板 -->
    <div id="preview-wrap" class="max-w-6xl mx-auto mt-6">

        <!-- 缺失相片報告面板 (列印時隱藏) -->
        <div id="missingReportPanel" class="no-print hidden mb-6 bg-red-50 border border-red-200 rounded-lg p-4 shadow-sm">
            <h3 class="text-lg font-bold text-red-700 mb-2 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                缺失相片報告
            </h3>
            <p class="text-sm text-red-600 mb-3" id="missingReportSummary"></p>
            <div class="max-h-40 overflow-y-auto bg-white rounded border border-red-100 p-2">
                <ul id="missingReportList" class="list-disc pl-5 text-sm text-gray-700 space-y-1">
                    <!-- 缺失名單將在此生成 -->
                </ul>
            </div>
        </div>

        <!-- 實體 A4 畫布將渲染於此 -->
        <div id="print-container" class="pb-20">
            <!-- 初始提示狀態 -->
            <div id="empty-state" class="no-print flex flex-col items-center justify-center pt-20 text-gray-400">
                <svg class="w-20 h-20 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <p class="text-lg">載入資料後，實體 A4 排版預覽將在此顯示</p>
            </div>
        </div>
    </div>

    <!-- 缺少照片的 SVG Placeholder (轉為 Data URI 使用) -->
    <script>
        const noPhotoSvg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="120" viewBox="0 0 100 120"><rect width="100" height="120" fill="%23f1f5f9" rx="4"/><path fill="%2394a3b8" d="M50 35a15 15 0 100 30 15 15 0 000-30zm0 35c-13.3 0-40 6.7-40 20v10h80V90c0-13.3-26.7-20-40-20z"/></svg>`;

        // 校名與校徽（校徽已轉 base64 內嵌，唔使外部檔案）

        // 系統全域變數
        let allStudents = [];
        let classesList = [];
        let rawFilesMap = {};   // 原始相片檔 (Key: 1A-01, Value: File Object)
        let imageFilesMap = {}; // 已縮圖的相片 (Key: 1A-01, Value: JPEG data URL)
        const JPEG_QUALITY = 0.82; // 縮圖後的 JPEG 品質
        const STUDENTS_PER_PAGE = 20; // A4排版：4x5

        // DOM 元素
        const excelInput = document.getElementById('excelInput');
        const photoInput = document.getElementById('photoInput');
        const classSelect = document.getElementById('classSelect');
        const printBtn = document.getElementById('printBtn');
        const printContainer = document.getElementById('print-container');
        const emptyState = document.getElementById('empty-state');
        const excelStatus = document.getElementById('excelStatus');
        const photoStatus = document.getElementById('photoStatus');
        const photoQuality = document.getElementById('photoQuality');
        const schoolYear = document.getElementById('schoolYear');
        const missingReportPanel = document.getElementById('missingReportPanel');
        const missingReportSummary = document.getElementById('missingReportSummary');
        const missingReportList = document.getElementById('missingReportList');

        // 1. 處理 Excel 上傳
        excelInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    allStudents = [];
                    // 只讀取 S1 到 S6 的分頁
                    const targetSheets = ['S1', 'S2', 'S3', 'S4', 'S5', 'S6'];
                    
                    targetSheets.forEach(sheetName => {
                        if (workbook.Sheets[sheetName]) {
                            // 以 A-Z 定義欄位，這樣可以直接用 D, E, F, G 抓取
                            const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: "A", defval: ""});
                            
                            json.forEach((row, index) => {
                                // 略過第一行 (通常是標題)
                                if (index === 0 && (row['D'] === '班別' || row['D'] === 'Class')) return;

                                let cls = String(row['D']).trim();
                                let num = String(row['E']).trim();
                                let enName = String(row['F']).trim();
                                let cnName = String(row['G']).trim();

                                // 檢查是否為有效的學生資料 (有班別且有數字班號)
                                if (cls && num && !isNaN(parseInt(num))) {
                                    // 重要核心：班號補零 (例如 1 -> 01)
                                    let numPadded = parseInt(num).toString().padStart(2, '0');
                                    let studentId = `${cls.toUpperCase()}-${numPadded}`; // 如 1A-01
                                    
                                    allStudents.push({
                                        class: cls.toUpperCase(),
                                        num: parseInt(num), // 用作排序
                                        id: studentId,
                                        en: enName,
                                        cn: cnName
                                    });
                                }
                            });
                        }
                    });

                    if (allStudents.length === 0) {
                        alert("在 S1-S6 分頁的 D-G 欄中找不到有效的學生資料！請檢查 Excel 格式。");
                        return;
                    }

                    // 提取所有獨立的班別並排序 (如 1A, 1B, 2A...)
                    classesList = [...new Set(allStudents.map(s => s.class))].sort();
                    
                    // 更新下拉選單
                    classSelect.innerHTML = '<option value="">-- 請選擇要預覽的班別 --</option>';
                    
                    // 新增「全校」選項
                    let allOption = document.createElement('option');
                    allOption.value = "ALL";
                    allOption.innerText = `🌟 全校 (共 ${classesList.length} 班, ${allStudents.length} 人)`;
                    classSelect.appendChild(allOption);

                    classesList.forEach(cls => {
                        let option = document.createElement('option');
                        option.value = cls;
                        // 計算該班人數
                        let count = allStudents.filter(s => s.class === cls).length;
                        option.innerText = `${cls} 班 (${count} 人)`;
                        classSelect.appendChild(option);
                    });

                    classSelect.disabled = false;
                    excelStatus.innerHTML = `✅ 成功讀取 ${allStudents.length} 位學生資料。`;
                    excelStatus.className = "text-xs text-green-600 mt-2 font-bold";
                    
                    checkReadyState();

                } catch (error) {
                    console.error(error);
                    alert("讀取 Excel 失敗，請確保檔案格式正確。");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // ====== 相片縮圖：大幅減細匯出 PDF 的檔案大小 ======
        // 格仔內的相片實際只印約 21mm x 28mm，300dpi 亦只需約 250x330px，
        // 直接用原圖(通常 2-5MB)會令 PDF 大到幾百 MB 且列印極慢。
        async function shrinkPhoto(file, maxPx) {
            let bmp;
            try {
                bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
            } catch (err) {
                bmp = await createImageBitmap(file); // 舊瀏覽器 fallback
            }
            const scale = Math.min(1, maxPx / Math.max(bmp.width, bmp.height));
            const w = Math.max(1, Math.round(bmp.width * scale));
            const h = Math.max(1, Math.round(bmp.height * scale));

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; // PNG 透明底轉 JPEG 時填白
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(bmp, 0, 0, w, h);
            if (bmp.close) bmp.close();

            return canvas.toDataURL('image/jpeg', JPEG_QUALITY);
        }

        // 依目前解析度設定，把 rawFilesMap 全部轉成 imageFilesMap
        async function processAllPhotos() {
            const maxPx = parseInt(photoQuality.value, 10);
            const ids = Object.keys(rawFilesMap);
            imageFilesMap = {};

            if (ids.length === 0) return;

            // 「原圖」模式：直接用 object URL，唔壓縮
            if (!maxPx) {
                ids.forEach(id => { imageFilesMap[id] = URL.createObjectURL(rawFilesMap[id]); });
                photoStatus.innerHTML = `✅ 已載入 ${ids.length} 張相片（原圖，未壓縮）。`;
                photoStatus.className = "text-xs text-amber-600 mt-2 font-bold";
                return;
            }

            photoQuality.disabled = true;
            photoInput.disabled = true;
            let bytes = 0;

            for (let i = 0; i < ids.length; i++) {
                if (i % 10 === 0) {
                    photoStatus.innerHTML = `⏳ 壓縮相片中… ${i} / ${ids.length}`;
                    photoStatus.className = "text-xs text-green-700 mt-2 font-bold";
                    await new Promise(r => setTimeout(r, 0)); // 讓畫面更新
                }
                try {
                    const dataUrl = await shrinkPhoto(rawFilesMap[ids[i]], maxPx);
                    imageFilesMap[ids[i]] = dataUrl;
                    bytes += dataUrl.length * 0.75; // base64 → 大約位元組數
                } catch (err) {
                    console.error('壓縮失敗，改用原圖：' + ids[i], err);
                    imageFilesMap[ids[i]] = URL.createObjectURL(rawFilesMap[ids[i]]);
                }
            }

            photoQuality.disabled = false;
            photoInput.disabled = false;

            const avgKb = Math.round(bytes / ids.length / 1024);
            const totalMb = (bytes / 1048576).toFixed(1);
            photoStatus.innerHTML = `✅ 成功載入 ${ids.length} 張相片（已縮至 ${maxPx}px，平均 ${avgKb}KB，合共約 ${totalMb}MB）。`;
            photoStatus.className = "text-xs text-green-600 mt-2 font-bold";
        }

        // 2. 處理相片資料夾載入
        photoInput.addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            rawFilesMap = {};

            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                // 確保是圖片檔
                if (file.type.startsWith('image/')) {
                    // 取得去除副檔名的檔名，並轉為大寫作配對 (例: "1A-01")
                    let nameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.')).toUpperCase();
                    rawFilesMap[nameWithoutExt] = file;
                }
            }

            await processAllPhotos();

            checkReadyState();

            // 如果已經選了班別，相片載入後重新渲染
            if (classSelect.value) {
                handleSelection(classSelect.value);
            }
        });

        // 改變解析度：重新壓縮已載入的相片並重繪
        photoQuality.addEventListener('change', async function() {
            if (Object.keys(rawFilesMap).length === 0) return;
            await processAllPhotos();
            if (classSelect.value) {
                handleSelection(classSelect.value);
            }
        });

        function checkReadyState() {
            if (allStudents.length > 0) {
                classSelect.disabled = false;
            }
        }

        // 學年：xxxx-xxxx
        function getSchoolYear() {
            return (schoolYear.value || '').trim();
        }

        // 即時更新已渲染頁面的學年（唔使重繪成份表，打字都唔會卡）
        schoolYear.addEventListener('input', function() {
            const v = getSchoolYear();
            const bad = v.length > 0 && !/^\d{4}-\d{4}$/.test(v);
            schoolYear.classList.toggle('border-red-400', bad);
            schoolYear.classList.toggle('bg-red-50', bad);
            document.querySelectorAll('.school-year').forEach(el => { el.innerText = v; });
        });

        // 3. 監聽下拉選單
        classSelect.addEventListener('change', function(e) {
            const selection = e.target.value;
            handleSelection(selection);
        });

        function handleSelection(selection) {
            printContainer.innerHTML = ''; // 清空畫布
            missingReportPanel.classList.add('hidden'); // 隱藏報告

            if (!selection) {
                printContainer.appendChild(emptyState);
                printBtn.disabled = true;
                return;
            }

            let studentsToRender = [];
            
            if (selection === "ALL") {
                // 選全校時，將所有學生按班別、學號排序
                studentsToRender = [...allStudents].sort((a, b) => {
                    if (a.class === b.class) {
                        return a.num - b.num;
                    }
                    return a.class.localeCompare(b.class);
                });
                
                // 逐班渲染
                classesList.forEach(cls => {
                    let classStudents = studentsToRender.filter(s => s.class === cls);
                    renderPagesForClass(cls, classStudents);
                });
            } else {
                // 選單一班別
                studentsToRender = allStudents.filter(s => s.class === selection);
                studentsToRender.sort((a, b) => a.num - b.num);
                renderPagesForClass(selection, studentsToRender);
            }

            generateMissingReport(studentsToRender, selection === "ALL" ? "全校" : `${selection}班`);
            printBtn.disabled = false;
        }


        // ====== 核心渲染引擎：生成 A4 實體頁面 ======
        function renderPagesForClass(cls, classStudents) {
            if (classStudents.length === 0) return;

            // 計算該班需要幾張 A4 紙
            const totalPages = Math.ceil(classStudents.length / STUDENTS_PER_PAGE);

            for (let i = 0; i < totalPages; i++) {
                // 取出這頁要顯示的 20 個學生
                let pageStudents = classStudents.slice(i * STUDENTS_PER_PAGE, (i + 1) * STUDENTS_PER_PAGE);

                // 建立一張虛擬 A4 紙
                let pageDiv = document.createElement('div');
                pageDiv.className = 'a4-page';

                // 頁首：校徽（左） ┃ 校名 + 學年（中） ┃ 班別 + 頁碼（右）
                let header = document.createElement('div');
                header.className = 'page-header';

                let logo = document.createElement('img');
                logo.className = 'school-logo';
                logo.src = SCHOOL_LOGO;
                logo.alt = '校徽';
                header.appendChild(logo);

                let mid = document.createElement('div');
                mid.className = 'hdr-mid';

                let nameEl = document.createElement('div');
                nameEl.className = 'school-name';
                nameEl.innerText = SCHOOL_NAME;
                mid.appendChild(nameEl);

                let yearEl = document.createElement('div');
                yearEl.className = 'school-year';
                yearEl.innerText = getSchoolYear();
                mid.appendChild(yearEl);

                header.appendChild(mid);

                let titleEl = document.createElement('div');
                titleEl.className = 'sheet-title';

                let titleLine = document.createElement('div');
                titleLine.innerText = `${cls} 班學生相片表`;
                titleEl.appendChild(titleLine);

                if (totalPages > 1) {
                    let pageLine = document.createElement('div');
                    pageLine.innerText = `(P.${i + 1} / ${totalPages})`;
                    titleEl.appendChild(pageLine);
                }

                header.appendChild(titleEl);

                pageDiv.appendChild(header);

                // 建立格仔表容器
                let grid = document.createElement('div');
                grid.className = 'student-grid';

                // 填入學生資料
                pageStudents.forEach(student => {
                    let card = document.createElement('div');
                    card.className = 'student-card';

                    // 相片
                    let photoArea = document.createElement('div');
                    photoArea.className = 'photo-area';
                    let img = document.createElement('img');
                    
                    // 從 Map 尋找相片（已是縮圖後的 data URL）
                    if (imageFilesMap[student.id]) {
                        img.src = imageFilesMap[student.id];
                    } else {
                        img.src = noPhotoSvg; // 找不到照片時顯示佔位圖
                        card.classList.add('bg-red-50'); // 稍微標示一下沒有相片的格子
                    }
                    photoArea.appendChild(img);

                    // 文字資料
                    let textArea = document.createElement('div');
                    textArea.className = 'text-area';
                    textArea.innerHTML = `
                        <div class="st-id">${student.id}</div>
                        <div class="st-cn">${student.cn}</div>
                        <div class="st-en" title="${student.en}">${student.en || '&nbsp;'}</div>
                    `;

                    card.appendChild(photoArea);
                    card.appendChild(textArea);
                    grid.appendChild(card);
                });

                // 如果該頁未滿 20 人，補上空白虛線格子
                const emptySlotsCount = STUDENTS_PER_PAGE - pageStudents.length;
                for (let j = 0; j < emptySlotsCount; j++) {
                    let emptyCard = document.createElement('div');
                    emptyCard.className = 'student-card empty-slot';
                    grid.appendChild(emptyCard);
                }

                pageDiv.appendChild(grid);
                printContainer.appendChild(pageDiv);
            }
        }

        // ====== 缺失相片報告生成器 ======
        function generateMissingReport(studentsToCheck, scopeName) {
            missingReportList.innerHTML = '';
            let missingStudents = [];

            studentsToCheck.forEach(student => {
                if (!imageFilesMap[student.id]) {
                    missingStudents.push(student);
                }
            });

            if (missingStudents.length > 0) {
                missingReportSummary.innerText = `在 ${scopeName} 名單中，共有 ${missingStudents.length} 位學生未提供相片。`;
                
                missingStudents.forEach(s => {
                    let li = document.createElement('li');
                    li.innerHTML = `<strong>${s.id}</strong> - ${s.cn} (${s.en})`;
                    missingReportList.appendChild(li);
                });
                
                missingReportPanel.classList.remove('hidden');
            }
        }

    </script>
</body>
